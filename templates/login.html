<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENOLOGIX - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-primary: #ec4899;
            --accent-secondary: #8b5cf6;
            --border-color: rgba(255,255,255,0.1);
        }

        body.light-theme {
            --bg-primary: #f8fafc;
            --bg-secondary: #e2e8f0;
            --bg-card: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-primary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(1rem, 5vw, 2rem);
            transition: all 0.3s ease;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 50%, rgba(139, 92, 246, 0.15), transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(236, 72, 153, 0.15), transparent 50%);
            pointer-events: none;
        }

        .container {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            padding: clamp(1.5rem, 6vw, 2.5rem) clamp(1.5rem, 5vw, 2rem);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.8rem, 7vw, 2.4rem);
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: clamp(0.95rem, 4vw, 1.1rem);
        }

        .form-group {
            margin-bottom: clamp(1rem, 4vw, 1.5rem);
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: clamp(0.9rem, 3.5vw, 1rem);
        }

        .form-input {
            width: 100%;
            padding: clamp(0.8rem, 4vw, 0.9rem) 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            font-size: clamp(0.95rem, 4vw, 1rem);
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
        }

        .forgot-password {
            text-align: right;
            margin-bottom: 1.5rem;
        }

        .forgot-password a {
            color: var(--accent-primary);
            text-decoration: none;
            font-size: clamp(0.85rem, 3.5vw, 0.9rem);
        }

        .btn-primary {
            width: 100%;
            padding: clamp(0.9rem, 4vw, 1rem);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: clamp(1rem, 4vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider-text {
            padding: 0 1rem;
            color: var(--text-secondary);
            font-size: clamp(0.85rem, 3.5vw, 0.9rem);
        }

        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
            font-size: clamp(0.9rem, 4vw, 1rem);
        }

        .signup-link a {
            color: var(--accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .alert {
            padding: clamp(0.8rem, 4vw, 1rem);
            margin-bottom: 1.5rem;
            border-radius: 0.75rem;
            text-align: center;
            font-size: clamp(0.9rem, 4vw, 1rem);
        }

        .alert.error { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .alert.success { background: rgba(16, 185, 129, 0.15); color: #10b981; }

        /* ──────────────────────────────────────────────
           RESPONSIVE ADJUSTMENTS
        ────────────────────────────────────────────── */

        @media (max-width: 480px) {
            body { padding: 1rem; }

            .container {
                padding: clamp(1.5rem, 6vw, 2rem) clamp(1rem, 5vw, 1.5rem);
                margin: 0.5rem;
                border-radius: 1.25rem;
            }

            h1 { font-size: clamp(1.6rem, 8vw, 2rem); }

            .form-input { padding: 0.8rem 0.9rem; font-size: 0.95rem; }

            .btn-primary { padding: 0.85rem; font-size: 1rem; }

            .divider-text { padding: 0 0.8rem; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ENOLOGIX</h1>
        <p class="subtitle">Welcome back</p>

        <!-- Alert Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-input" placeholder="Enter your username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="forgot-password">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">OR</span>
            <div class="divider-line"></div>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="{{ url_for('register') }}">Sign Up</a>
        </div>
    </div>

    <script>
        // Apply saved theme
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
        }
    </script>
</body>
</html>
